    <text x="180" y="360">@3</text>
    <text x="270" y="360">@5</text>
    <text x="360" y="360">@10</text>
    <text x="450" y="360">@20</text>
    <text x="540" y="360">@30</text>
    <text x="630" y="360">@50</text>
    <text x="720" y="360">@100</text>
  </g>
  <text x="405" y="380" font-size="12" fill="#57606a" text-anchor="middle">k</text>

  <!-- 閾値200 -->
  <polyline fill="none" stroke="#cf222e" stroke-width="2"
    points="90,317.5 180,227.5 270,220 360,175 450,85 540,62.5 630,55 720,47.5"/>
