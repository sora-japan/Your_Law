<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', Meiryo, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="760" height="470" fill="#ffffff"/>

  <text x="380" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">条文型40問 Recall@k（hybrid-rerank・前置あり・法令集合固定）</text>

  <!-- gridlines + y labels -->
  <g stroke="#d1d9e0" stroke-width="1">
    <line x1="90" y1="340" x2="720" y2="340"/>
    <line x1="90" y1="280" x2="720" y2="280"/>
    <line x1="90" y1="220" x2="720" y2="220"/>
    <line x1="90" y1="160" x2="720" y2="160"/>
    <line x1="90" y1="100" x2="720" y2="100"/>
    <line x1="90" y1="40" x2="720" y2="40"/>
  </g>
  <g font-size="11" fill="#57606a" text-anchor="end">
    <text x="80" y="344">0.50</text>
    <text x="80" y="284">0.60</text>
    <text x="80" y="224">0.70</text>
    <text x="80" y="164">0.80</text>
    <text x="80" y="104">0.90</text>
    <text x="80" y="44">1.00</text>
  </g>
  <text x="26" y="190" font-size="12" fill="#57606a" text-anchor="middle" transform="rotate(-90 26 190)">Recall</text>

  <!-- x axis -->
  <line x1="90" y1="340" x2="720" y2="340" stroke="#8c959f" stroke-width="1.5"/>
