    <circle cx="270" cy="115" r="4"/><circle cx="360" cy="107.5" r="4"/>
    <circle cx="450" cy="77.5" r="4"/><circle cx="540" cy="62.5" r="4"/>
    <circle cx="630" cy="55" r="4"/><circle cx="720" cy="55" r="4"/>
  </g>

  <!-- 閾値2000 -->
  <polyline fill="none" stroke="#1a7f37" stroke-width="2"
    points="90,250 180,137.5 270,107.5 360,92.5 450,70 540,70 630,55 720,40"/>
  <g fill="#1a7f37">
    <circle cx="90" cy="250" r="3.5"/><circle cx="180" cy="137.5" r="3.5"/>
    <circle cx="270" cy="107.5" r="3.5"/><circle cx="360" cy="92.5" r="3.5"/>
