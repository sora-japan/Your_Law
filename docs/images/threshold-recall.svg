    <circle cx="90" cy="317.5" r="3.5"/><circle cx="180" cy="227.5" r="3.5"/>
    <circle cx="270" cy="220" r="3.5"/><circle cx="360" cy="175" r="3.5"/>
    <circle cx="450" cy="85" r="3.5"/><circle cx="540" cy="62.5" r="3.5"/>
    <circle cx="630" cy="55" r="3.5"/><circle cx="720" cy="47.5" r="3.5"/>
  </g>

  <!-- 閾値500 -->
  <polyline fill="none" stroke="#bc4c00" stroke-width="2"
    points="90,287.5 180,205 270,175 360,130 450,70 540,70 630,55 720,47.5"/>
  <g fill="#bc4c00">
    <circle cx="90" cy="287.5" r="3.5"/><circle cx="180" cy="205" r="3.5"/>
    <circle cx="270" cy="175" r="3.5"/><circle cx="360" cy="130" r="3.5"/>
    <circle cx="450" cy="70" r="3.5"/><circle cx="540" cy="70" r="3.5"/>
    <circle cx="630" cy="55" r="3.5"/><circle cx="720" cy="47.5" r="3.5"/>
  </g>

