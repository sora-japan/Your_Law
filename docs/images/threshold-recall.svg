<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', Meiryo, sans-serif">
  <rect width="760" height="470" fill="#ffffff"/>

  <text x="380" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">条文型40問 Recall@k（hybrid-rerank・前置あり・法令集合固定）</text>

  <!-- gridlines -->
  <g stroke="#d1d9e0" stroke-width="1">
    <line x1="90" y1="340" x2="720" y2="340"/>
    <line x1="90" y1="302.5" x2="720" y2="302.5"/>
    <line x1="90" y1="265" x2="720" y2="265"/>
    <line x1="90" y1="227.5" x2="720" y2="227.5"/>
    <line x1="90" y1="190" x2="720" y2="190"/>
    <line x1="90" y1="152.5" x2="720" y2="152.5"/>
    <line x1="90" y1="115" x2="720" y2="115"/>
    <line x1="90" y1="77.5" x2="720" y2="77.5"/>
    <line x1="90" y1="40" x2="720" y2="40"/>
  </g>
  <g font-size="11" fill="#57606a" text-anchor="end">
    <text x="80" y="344">0.60</text>
    <text x="80" y="306.5">0.65</text>
    <text x="80" y="269">0.70</text>
    <text x="80" y="231.5">0.75</text>
    <text x="80" y="194">0.80</text>
    <text x="80" y="156.5">0.85</text>
    <text x="80" y="119">0.90</text>
    <text x="80" y="81.5">0.95</text>
    <text x="80" y="44">1.00</text>
  </g>
  <text x="26" y="190" font-size="12" fill="#57606a" text-anchor="middle" transform="rotate(-90 26 190)">Recall</text>

  <!-- x axis -->
  <line x1="90" y1="340" x2="720" y2="340" stroke="#8c959f" stroke-width="1.5"/>
  <g font-size="11" fill="#57606a" text-anchor="middle">
    <text x="90" y="360">@1</text>
    <text x="180" y="360">@3</text>
    <text x="270" y="360">@5</text>
    <text x="360" y="360">@10</text>
    <text x="450" y="360">@20</text>
    <text x="540" y="360">@30</text>
    <text x="630" y="360">@50</text>
    <text x="720" y="360">@100</text>
  </g>
  <text x="405" y="380" font-size="12" fill="#57606a" text-anchor="middle">k</text>

  <!-- 閾値200 : 破線 -->
  <polyline fill="none" stroke="#cf222e" stroke-width="2" stroke-dasharray="5 3"
    points="90,246.25 180,171.25 270,152.5 360,143.125 450,105.625 540,86.875 630,77.5 720,68.125"/>
  <g fill="#cf222e" stroke="#ffffff" stroke-width="1.5">
    <circle cx="90" cy="246.25" r="3.5"/><circle cx="180" cy="171.25" r="3.5"/>
    <circle cx="270" cy="152.5" r="3.5"/><circle cx="360" cy="143.125" r="3.5"/>
    <circle cx="450" cy="105.625" r="3.5"/><circle cx="540" cy="86.875" r="3.5"/>
    <circle cx="630" cy="77.5" r="3.5"/><circle cx="720" cy="68.125" r="3.5"/>
  </g>

  <!-- 閾値1000 : 長破線 -->
  <polyline fill="none" stroke="#9a6700" stroke-width="2" stroke-dasharray="10 4"
    points="90,255.625 180,171.25 270,133.75 360,133.75 450,86.875 540,68.125 630,58.75 720,49.375"/>
  <g fill="#9a6700" stroke="#ffffff" stroke-width="1.5">
    <circle cx="90" cy="255.625" r="3.5"/><circle cx="180" cy="171.25" r="3.5"/>
    <circle cx="270" cy="133.75" r="3.5"/><circle cx="360" cy="133.75" r="3.5"/>
    <circle cx="450" cy="86.875" r="3.5"/><circle cx="540" cy="68.125" r="3.5"/>
    <circle cx="630" cy="58.75" r="3.5"/><circle cx="720" cy="49.375" r="3.5"/>
  </g>

  <!-- 閾値2000 : 点線 -->
  <polyline fill="none" stroke="#1a7f37" stroke-width="2" stroke-dasharray="2 3"
    points="90,293.125 180,171.25 270,124.375 360,115 450,77.5 540,77.5 630,49.375 720,40"/>
  <g fill="#1a7f37" stroke="#ffffff" stroke-width="1.5">
    <circle cx="90" cy="293.125" r="3.5"/><circle cx="180" cy="171.25" r="3.5"/>
    <circle cx="270" cy="124.375" r="3.5"/><circle cx="360" cy="115" r="3.5"/>
    <circle cx="450" cy="77.5" r="3.5"/><circle cx="540" cy="77.5" r="3.5"/>
    <circle cx="630" cy="49.375" r="3.5"/><circle cx="720" cy="40" r="3.5"/>
  </g>

  <!-- 閾値500（採用） : 実線・太線 -->
  <polyline fill="none" stroke="#0969da" stroke-width="2.75"
    points="90,236.875 180,143.125 270,133.75 360,124.375 450,77.5 540,77.5 630,58.75 720,49.375"/>
  <g fill="#0969da" stroke="#ffffff" stroke-width="1.5">
    <circle cx="90" cy="236.875" r="4.5"/><circle cx="180" cy="143.125" r="4.5"/>
    <circle cx="270" cy="133.75" r="4.5"/><circle cx="360" cy="124.375" r="4.5"/>
    <circle cx="450" cy="77.5" r="4.5"/><circle cx="540" cy="77.5" r="4.5"/>
    <circle cx="630" cy="58.75" r="4.5"/><circle cx="720" cy="49.375" r="4.5"/>
  </g>

  <!-- legend -->
  <g font-size="12" fill="#1f2328">
    <line x1="100" y1="412" x2="130" y2="412" stroke="#cf222e" stroke-width="2" stroke-dasharray="5 3"/>
    <circle cx="115" cy="412" r="3.5" fill="#cf222e" stroke="#ffffff" stroke-width="1.5"/>
    <text x="138" y="416">閾値200（96,487チャンク）</text>

    <line x1="400" y1="412" x2="430" y2="412" stroke="#0969da" stroke-width="2.75"/>
    <circle cx="415" cy="412" r="4.5" fill="#0969da" stroke="#ffffff" stroke-width="1.5"/>
    <text x="438" y="416" font-weight="600">閾値500・採用（64,593チャンク）</text>

    <line x1="100" y1="440" x2="130" y2="440" stroke="#9a6700" stroke-width="2" stroke-dasharray="10 4"/>
    <circle cx="115" cy="440" r="3.5" fill="#9a6700" stroke="#ffffff" stroke-width="1.5"/>
    <text x="138" y="444">閾値1000（50,047チャンク）</text>

    <line x1="400" y1="440" x2="430" y2="440" stroke="#1a7f37" stroke-width="2" stroke-dasharray="2 3"/>
    <circle cx="415" cy="440" r="3.5" fill="#1a7f37" stroke="#ffffff" stroke-width="1.5"/>
    <text x="438" y="444">閾値2000（42,387チャンク）</text>
  </g>
</svg>
